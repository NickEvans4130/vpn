# Install to /etc/NetworkManager/conf.d/pqvpn.conf
#
# Tells NetworkManager to leave the pqvpn TUN interface alone -- pqvpn
# manages its own address and routing, and NM would otherwise try to
# DHCP it or reset it on a network change, fighting the daemon for
# control of the interface.
[keyfile]
unmanaged-devices=interface-name:pqvpn0
