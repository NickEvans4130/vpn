[package]
name = "pqvpn"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[[bin]]
name = "pqvpnd"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
tun-rs = { version = "2.8.7", features = ["async_tokio"] }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
