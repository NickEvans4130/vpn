[package]
name = "pqvpn"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[[bin]]
name = "pqvpnd"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
tun-rs = { version = "2.8.7", features = ["async_tokio"] }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
x25519-dalek = { version = "3.0.0", features = ["reusable_secrets", "static_secrets", "getrandom"] }
sha2 = "0.11.0"
hkdf = "0.13.0"
chacha20poly1305 = "0.11.0"
zeroize = "1.9.0"
getrandom = "0.4.3"
ml-kem = { version = "0.3.2", features = ["getrandom", "zeroize"] }
axum = { version = "0.8.9", features = ["ws"] }
tower-http = { version = "0.7.0", features = ["fs"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
